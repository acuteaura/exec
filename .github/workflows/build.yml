name: Build and push OCI image to ghcr.io

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The GitHub repository namespace (e.g. acuteaura/exec). Individual image
  # targets live under it as sub-images; this workflow builds the `mcp` target.
  REPO_NAMESPACE: ${{ github.repository }}
  IMAGE_TARGET: mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build the OCI image
        run: nix build .#image --print-out-paths --out-link image.tar.gz

      - name: Load the image into Docker
        run: docker load < image.tar.gz

      - name: Inspect the loaded image tag
        run: docker images acuteaura/exec-mcp

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image
        if: github.event_name != 'pull_request'
        run: |
          # Map the local build to ghcr.io/<owner>/<repo>/<target>:<tag>.
          # The `mcp` image target is distinct from any future images that will
          # share this repository namespace.
          NS_LOWER="$(echo "$REPO_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          FULL="$REGISTRY/$NS_LOWER/$IMAGE_TARGET"
          docker tag acuteaura/exec-mcp:latest "$FULL:latest"
          docker tag acuteaura/exec-mcp:latest "$FULL:sha-$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag acuteaura/exec-mcp:latest "$FULL:${GITHUB_REF#refs/tags/}"
          fi

      - name: Push to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          NS_LOWER="$(echo "$REPO_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          FULL="$REGISTRY/$NS_LOWER/$IMAGE_TARGET"
          docker push "$FULL:latest"
          docker push "$FULL:sha-$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker push "$FULL:${GITHUB_REF#refs/tags/}"
          fi
