name: Build and push OCI image to ghcr.io

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build the OCI image
        run: nix build .#image --print-out-paths --out-link image.tar.gz

      - name: Load the image into Docker
        run: docker load < image.tar.gz

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image
        if: github.event_name != 'pull_request'
        run: |
          # Map the image to ghcr.io/<owner>/<repo>:latest and :sha.
          REPO_LOWER="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          docker tag acuteaura/exec:latest "$REGISTRY/$REPO_LOWER:latest"
          docker tag acuteaura/exec:latest "$REGISTRY/$REPO_LOWER:sha-$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag acuteaura/exec:latest "$REGISTRY/$REPO_LOWER:${GITHUB_REF#refs/tags/}"
          fi

      - name: Push to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          REPO_LOWER="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          docker push "$REGISTRY/$REPO_LOWER:latest"
          docker push "$REGISTRY/$REPO_LOWER:sha-$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker push "$REGISTRY/$REPO_LOWER:${GITHUB_REF#refs/tags/}"
          fi
